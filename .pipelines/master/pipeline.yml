name: $(Date:yyyyMMdd).$(Rev:r)

trigger:
  branches:
    include:
    - master

pr:
  branches:
    include:
    - master

variables:
  buildConfiguration: Release
  feedId: 3ed80ad0-ebb0-49c2-bc79-ab237f51e313
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NUGET_XMLDOC_MODE: skip

stages:
- stage: BuildAndTest
  displayName: Build and test
  jobs:
  - job: Build
    displayName: Build, test, and pack
    timeoutInMinutes: 120
    pool:
      vmImage: windows-latest
    steps:
    - checkout: self
      fetchDepth: 0

    - task: NodeTool@0
      displayName: Install Node.js
      inputs:
        versionSpec: 22.x

    - task: Npm@1
      displayName: NPM CI (Umbrella.AspNetCore.Blazor)
      inputs:
        command: ci
        workingDir: AspNetCore/src/Umbrella.AspNetCore.Blazor

    - task: Npm@1
      displayName: NPM Test (Umbrella.AspNetCore.Blazor)
      inputs:
        command: custom
        workingDir: AspNetCore/src/Umbrella.AspNetCore.Blazor
        customCommand: test

    - task: Npm@1
      displayName: NPM Build Release (Umbrella.AspNetCore.Blazor)
      inputs:
        command: custom
        workingDir: AspNetCore/src/Umbrella.AspNetCore.Blazor
        customCommand: run build-release

    - task: UseDotNet@2
      displayName: Install .NET 8 SDK
      inputs:
        packageType: sdk
        version: 8.x

    - task: UseDotNet@2
      displayName: Install .NET 9 SDK
      inputs:
        packageType: sdk
        version: 9.x

    - task: UseDotNet@2
      displayName: Install .NET 10 SDK
      inputs:
        packageType: sdk
        version: 10.x

    - task: DotNetCoreCLI@2
      displayName: Restore workloads
      inputs:
        command: custom
        custom: workload
        arguments: restore

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: Umbrella Code Libraries.sln
        feedsToUse: config
        nugetConfigPath: NuGet.Config

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: Umbrella Code Libraries.sln
        arguments: --configuration $(buildConfiguration) --no-restore

    - task: PowerShell@2
      displayName: Test
      inputs:
        targetType: inline
        pwsh: true
        workingDirectory: $(Build.SourcesDirectory)
        script: |
          $ErrorActionPreference = 'Stop'
          $containerTestProjects = @(
            'Umbrella.AzureServiceBus.Test.csproj'
            'Umbrella.DynamicImage.Test.csproj'
            'Umbrella.FileSystem.Test.csproj'
            'Umbrella.Utilities.Threading.Redis.Test.csproj'
          )
          $testProjects = Get-ChildItem -Path '$(Build.SourcesDirectory)' -Filter *.Test.csproj -Recurse |
            Where-Object Name -NotIn $containerTestProjects |
            Sort-Object FullName

          if (-not $testProjects) {
            throw 'No test projects were found.'
          }

          $failedProjects = @()

          foreach ($testProject in $testProjects) {
            Write-Host "Running tests for '$($testProject.FullName)'."

            & dotnet test `
              --project $testProject.FullName `
              --configuration '$(buildConfiguration)' `
              --no-build `
              --no-restore `
              --output Detailed `
              --report-trx `
              --coverage `
              --coverage-output-format cobertura `
              --coverage-output coverage.cobertura.xml

            if ($LASTEXITCODE -ne 0) {
              Write-Host "dotnet test failed for '$($testProject.FullName)' with exit code $LASTEXITCODE."
              $failedProjects += $testProject.FullName
            }
          }

          if ($failedProjects.Count -gt 0) {
            Write-Host 'Failed test projects:'
            Write-Host ($failedProjects -join [Environment]::NewLine)
            throw "Test failures detected in $($failedProjects.Count) project(s)."
          }

    - task: PublishTestResults@2
      displayName: Publish test results
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: $(Build.SourcesDirectory)/**/*.trx
        mergeTestResults: true
        failTaskOnFailedTests: false
        testRunTitle: dotnet test (MTP)

    - task: PublishCodeCoverageResults@2
      displayName: Publish code coverage
      condition: succeededOrFailed()
      inputs:
        summaryFileLocation: $(Build.SourcesDirectory)/**/*.cobertura.xml

    - task: DotNetCoreCLI@2
      displayName: Pack
      inputs:
        command: pack
        packagesToPack: '**/src/**/*.csproj'
        configuration: $(buildConfiguration)
        nobuild: true
        packDirectory: $(Build.ArtifactStagingDirectory)/packages
        versioningScheme: off

    - task: PublishPipelineArtifact@1
      displayName: Publish packages
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/packages
        artifact: packages

  - job: ContainerTests
    displayName: Test container-backed packages
    timeoutInMinutes: 60
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: Install .NET 10 SDK
      inputs:
        packageType: sdk
        version: 10.x

    - task: DotNetCoreCLI@2
      displayName: Restore container test projects
      inputs:
        command: restore
        projects: |
          Core/test/Umbrella.Utilities.Threading.Redis.Test/Umbrella.Utilities.Threading.Redis.Test.csproj
          DynamicImage/test/Umbrella.DynamicImage.Test/Umbrella.DynamicImage.Test.csproj
          FileSystem/test/Umbrella.FileSystem.Test/Umbrella.FileSystem.Test.csproj
          Messaging/test/Umbrella.AzureServiceBus.Test/Umbrella.AzureServiceBus.Test.csproj
        feedsToUse: config
        nugetConfigPath: NuGet.Config

    - task: PowerShell@2
      displayName: Test container-backed packages
      inputs:
        targetType: inline
        pwsh: true
        workingDirectory: $(Build.SourcesDirectory)
        script: |
          $ErrorActionPreference = 'Stop'
          $env:UMBRELLA_FILESYSTEM_DISABLED_PROVIDERS = 'SharePoint,Dataverse'
          $testProjects = @(
            'Core/test/Umbrella.Utilities.Threading.Redis.Test/Umbrella.Utilities.Threading.Redis.Test.csproj'
            'DynamicImage/test/Umbrella.DynamicImage.Test/Umbrella.DynamicImage.Test.csproj'
            'FileSystem/test/Umbrella.FileSystem.Test/Umbrella.FileSystem.Test.csproj'
            'Messaging/test/Umbrella.AzureServiceBus.Test/Umbrella.AzureServiceBus.Test.csproj'
          )
          $failedProjects = @()

          foreach ($testProject in $testProjects) {
            Write-Host "Running container tests for '$testProject'."

            & dotnet test `
              --project $testProject `
              --configuration '$(buildConfiguration)' `
              --no-restore `
              --output Detailed `
              --report-trx `
              --coverage `
              --coverage-output-format cobertura `
              --coverage-output coverage.cobertura.xml

            if ($LASTEXITCODE -ne 0) {
              Write-Host "dotnet test failed for '$testProject' with exit code $LASTEXITCODE."
              $failedProjects += $testProject
            }
          }

          if ($failedProjects.Count -gt 0) {
            Write-Host 'Failed container test projects:'
            Write-Host ($failedProjects -join [Environment]::NewLine)
            throw "Test failures detected in $($failedProjects.Count) container test project(s)."
          }

    - task: PublishTestResults@2
      displayName: Publish container test results
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: $(Build.SourcesDirectory)/**/*.trx
        mergeTestResults: true
        failTaskOnFailedTests: false
        testRunTitle: dotnet test (Testcontainers)

    - task: PublishCodeCoverageResults@2
      displayName: Publish container test coverage
      condition: succeededOrFailed()
      inputs:
        summaryFileLocation: $(Build.SourcesDirectory)/**/*.cobertura.xml

- stage: PublishDevFeed
  displayName: Publish to ADO development feed
  dependsOn: BuildAndTest
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  jobs:
  - job: Publish
    displayName: Publish NuGet packages
    pool:
      vmImage: windows-latest
    steps:
    - checkout: none

    - task: DownloadPipelineArtifact@2
      displayName: Download packages
      inputs:
        artifact: packages
        targetPath: $(Pipeline.Workspace)/packages

    - task: NuGetCommand@2
      displayName: Push packages to ADO feed
      inputs:
        command: push
        packagesToPush: '$(Pipeline.Workspace)/packages/**/*.nupkg;$(Pipeline.Workspace)/packages/**/*.snupkg'
        nuGetFeedType: internal
        publishVstsFeed: $(feedId)
        allowPackageConflicts: true
        verbosityPush: Normal
