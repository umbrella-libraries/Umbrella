# ai-bundle:codex-mcp:start
[mcp_servers."ado-remarkablexcp"]
"command" = "powershell"
"args" = ["-NoLogo", "-NoProfile", "-NonInteractive", "-Command", "if ([string]::IsNullOrWhiteSpace($env:REMARKABLEXCP_ADO_PAT)) { throw \u0027REMARKABLEXCP_ADO_PAT is not set\u0027 }; $credential = \u0027codex:\u0027 \u002B $env:REMARKABLEXCP_ADO_PAT; $env:PERSONAL_ACCESS_TOKEN = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($credential)); Remove-Variable credential; \u0026 npx -y @azure-devops/mcp remarkablexcp --authentication pat; exit $LASTEXITCODE"]
"env_vars" = ["REMARKABLEXCP_ADO_PAT"]

[mcp_servers."ado-remote-mcp"]
"url" = "https://mcp.dev.azure.com/"
"http_headers" = { "X-MCP-Readonly" = "true", "X-MCP-Toolsets" = "repos,wiki,wit,pipelines" }

[mcp_servers."ado-thrive"]
"command" = "powershell"
"args" = ["-NoLogo", "-NoProfile", "-NonInteractive", "-Command", "if ([string]::IsNullOrWhiteSpace($env:THRIVE_ADO_PAT)) { throw \u0027THRIVE_ADO_PAT is not set\u0027 }; $credential = \u0027codex:\u0027 \u002B $env:THRIVE_ADO_PAT; $env:PERSONAL_ACCESS_TOKEN = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($credential)); Remove-Variable credential; \u0026 npx -y @azure-devops/mcp thriveforsend --authentication pat; exit $LASTEXITCODE"]
"env_vars" = ["THRIVE_ADO_PAT"]

[mcp_servers."ado-zinofi"]
"command" = "powershell"
"args" = ["-NoLogo", "-NoProfile", "-NonInteractive", "-Command", "if ([string]::IsNullOrWhiteSpace($env:ZINOFI_ADO_PAT)) { throw \u0027ZINOFI_ADO_PAT is not set\u0027 }; $credential = \u0027codex:\u0027 \u002B $env:ZINOFI_ADO_PAT; $env:PERSONAL_ACCESS_TOKEN = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($credential)); Remove-Variable credential; \u0026 npx -y @azure-devops/mcp zinofi --authentication pat; exit $LASTEXITCODE"]
"env_vars" = ["ZINOFI_ADO_PAT"]

[mcp_servers."aspire"]
"command" = "aspire"
"args" = ["agent", "mcp"]

[mcp_servers."atlassian"]
"url" = "https://mcp.atlassian.com/v2/mcp"
"env_http_headers" = { "Authorization" = "ATLASSIAN_MCP_AUTH_HEADER" }

[mcp_servers."azure"]
"command" = "npx"
"args" = ["-y", "@azure/mcp@latest", "server", "start"]

[mcp_servers."chrome-devtools"]
"command" = "npx"
"args" = ["-y", "chrome-devtools-mcp@latest"]

[mcp_servers."microsoft-learn"]
"url" = "https://learn.microsoft.com/api/mcp"

[mcp_servers."nuget"]
"command" = "dnx"
"args" = ["NuGet.Mcp.Server", "--source", "https://api.nuget.org/v3/index.json", "--yes"]

[mcp_servers."playwright"]
"command" = "npx"
"args" = ["-y", "@playwright/mcp@latest"]
# ai-bundle:codex-mcp:end
